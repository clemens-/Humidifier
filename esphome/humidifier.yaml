substitutions:
  device_name: humidifier
  friendly_name: Humidifier

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - lambda: 'id(atomizer_output).set_frequency(id(atomizer_frequency).state);'

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  cpu_frequency: 80MHz
  framework:
    type: esp-idf

logger:
  level: VERBOSE
  # baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  fast_connect: true
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

globals:
  - id: should_activate_atomizer
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: atomizer_cooldown_until
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: atomizer_total_on_ms
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: evaporated_total_mm3
    type: float
    restore_value: true
    initial_value: '0'
  - id: last_evap_calc_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: sht40_heater_cooldown_until
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: sht40_heater_lock_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: atomizer_pulse_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ctrl_integral
    type: float
    restore_value: true
    initial_value: '0'
  - id: ctrl_debt_s
    type: float
    restore_value: false
    initial_value: '0'
  - id: last_ctrl_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_pulse_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: prev_humidity
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: lid_hold_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

script:
  - id: atomizer_pulse
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(water_level_estimate).state >= 5.0f;'
          then:
            - lambda: 'id(last_pulse_start_ms) = millis();'
            - output.set_level:
                id: atomizer_output
                level: 50%
            - delay: !lambda 'return id(atomizer_pulse_ms);'
            - output.set_level:
                id: atomizer_output
                level: 0%
            - lambda: |-
                id(atomizer_cooldown_until) = millis() + (uint32_t)(id(atomizer_delay_time).state * 1000);
                id(atomizer_total_on_ms) += id(atomizer_pulse_ms);
          else:
            - lambda: 'ESP_LOGW("atomizer", "Water level below 5%%, skipping atomizer activation");'

  - id: humidity_check
    mode: single
    then:
      - lambda: |-
          // PI controller whose output u is an average atomizer on-time (s/min). The output is
          // accumulated as a dose "debt" and delivered as one variable-width pulse once it reaches
          // the minimum reliable pulse length and the post-pulse thermal rest has elapsed.
          // Plant fit (history 09-23..09-26): ~1.2 %RH per s on-time, leak time constant ~210 min.
          id(should_activate_atomizer) = false;
          float humidity = id(current_humidity).state;
          if (isnan(humidity)) return;
          uint32_t now_ms = millis();

          // The SHT40 heater leaves the sensor ~1 °C warm for well over 10 s, reading RH several
          // percent low; ignore readings until it has cooled down.
          const uint32_t HEATER_SETTLE_MS = 60000;
          if (id(sht40_heater_cooldown_until) != 0 &&
              (int32_t)(now_ms - id(sht40_heater_cooldown_until)) < (int32_t) HEATER_SETTLE_MS) return;

          // Lid opening: a drop > 1.5 %RH below the last settled reading. The box re-humidifies
          // passively within 1-2 min after closing, so don't mist into the open box. Comparing
          // against the settled reading keeps the post-pulse plume fall from looking like a drop.
          const float LID_DROP_PCT = 1.5f;
          const uint32_t LID_HOLD_MS = 180000;
          float prev = id(prev_humidity);
          if (!isnan(prev) && prev - humidity > LID_DROP_PCT) {
            id(lid_hold_until_ms) = now_ms + LID_HOLD_MS;
            ESP_LOGI("control", "Lid opening detected (%.2f -> %.2f), holding atomizer", prev, humidity);
          }
          if ((int32_t)(id(lid_hold_until_ms) - now_ms) > 0) {
            // Track the level during the hold so a slow recovery doesn't re-trigger it.
            id(prev_humidity) = humidity;
            id(ctrl_debt_s) = 0.0f;
            id(last_ctrl_ms) = now_ms;
            return;
          }

          // The reading right after a pulse sees the mist plume (~+0.5 %RH that vanishes within
          // a minute), not the box humidity, so the controller only acts on settled readings.
          const uint32_t PLUME_BLANK_MS = 90000;
          if (id(last_pulse_start_ms) != 0 && now_ms - id(last_pulse_start_ms) < PLUME_BLANK_MS) return;
          id(prev_humidity) = humidity;
          id(humidity_settled).publish_state(humidity);

          uint32_t last_ms = id(last_ctrl_ms);
          id(last_ctrl_ms) = now_ms;
          float dt_min = last_ms == 0 ? 1.0f : (now_ms - last_ms) / 60000.0f;
          if (dt_min < 0.25f) dt_min = 0.25f;
          if (dt_min > 3.0f) dt_min = 3.0f;

          float max_pulse_s = id(atomizer_on_time).state;
          float rest_s = id(atomizer_delay_time).state;
          float min_pulse_s = std::min(id(atomizer_min_pulse).state, max_pulse_s);
          // Highest sustainable average on-time: one max pulse per (pulse + rest) period.
          float cap = max_pulse_s * 60.0f / (max_pulse_s + rest_s);

          float e = id(humidity_setpoint).state - humidity;
          float raw = id(humidity_kp).state * e + id(ctrl_integral);
          float u = std::max(0.0f, std::min(raw, cap));

          // Anti-windup: don't integrate further into saturation or while the atomizer is blocked
          // by an empty tank (it wound I up to the cap, and the refill then overshot to ~80 %RH).
          // Positive errors integrate only near setpoint; negative errors always do, so an
          // overshoot unwinds I instead of freezing it and holding the humidity above setpoint.
          bool saturating = (raw > cap && e > 0) || (raw < 0 && e < 0);
          bool water_low = id(water_level_estimate).state < 5.0f;
          if ((e < 0 || (e < 2.0f && !water_low)) && !saturating) {
            float i = id(ctrl_integral) + id(humidity_ki).state * e * dt_min;
            id(ctrl_integral) = std::max(0.0f, std::min(i, cap));
          }

          id(ctrl_debt_s) = std::min(id(ctrl_debt_s) + u * dt_min, max_pulse_s);
          id(atomizer_demand).publish_state(cap > 0 ? 100.0f * u / cap : 0.0f);

          bool in_cooldown = now_ms < id(atomizer_cooldown_until);
          if (id(ctrl_debt_s) >= min_pulse_s && !in_cooldown && id(water_level_estimate).state >= 5.0f) {
            id(atomizer_pulse_ms) = (uint32_t)(id(ctrl_debt_s) * 1000.0f);
            id(ctrl_debt_s) = 0.0f;
            id(should_activate_atomizer) = true;
            ESP_LOGD("control", "e=%.2f u=%.3f s/min I=%.3f -> pulse %u ms", e, u, id(ctrl_integral), id(atomizer_pulse_ms));
          }
      - if:
          condition:
            lambda: 'return id(should_activate_atomizer);'
          then:
            - script.execute: atomizer_pulse

  - id: evaporation_update
    mode: single
    then:
      - lambda: |-
          float temp_c = id(current_temperature).state;
          float rh_pct = id(current_humidity).state;
          if (isnan(temp_c) || isnan(rh_pct)) return;

          uint32_t now_ms = millis();
          uint32_t last_ms = id(last_evap_calc_ms);
          id(last_evap_calc_ms) = now_ms;
          if (last_ms == 0) return; // first reading after boot, no interval to integrate yet
          float elapsed_s = (now_ms - last_ms) / 1000.0f;

          // Saturation vapor pressure via Magnus/Tetens approximation (Pa).
          float p_sat = 611.2f * expf((17.62f * temp_c) / (243.12f + temp_c));
          // Vapor pressure deficit, assuming water temperature == measured air temperature.
          float vpd = p_sat * (1.0f - rh_pct / 100.0f);
          if (vpd < 0.0f) vpd = 0.0f;

          // Ideal-gas conversion of the vapor pressure deficit to a vapor density deficit.
          const float M_WATER = 0.018015f; // kg/mol
          const float R_GAS = 8.314f;      // J/(mol*K)
          float temp_k = temp_c + 273.15f;
          float rho_deficit = (vpd * M_WATER) / (R_GAS * temp_k); // kg/m^3

          // Natural-convection mass-transfer coefficient for calm air over a still water
          // surface, calibrated at standard pressure (1013.25 hPa) and scaled inversely
          // with ambient pressure since vapor diffusivity in air is ~1/P.
          const float H_M_STD = 0.003f; // m/s @ 1013.25 hPa
          const float P_STD_HPA = 1013.25f;
          const float P_AMBIENT_HPA = 960.0f;
          float h_m = H_M_STD * (P_STD_HPA / P_AMBIENT_HPA);

          const float TANK_SURFACE_AREA_M2 = 1429.115e-6f; // 1429.115 mm^2, straight-walled tank

          float mass_rate_kg_s = h_m * TANK_SURFACE_AREA_M2 * rho_deficit;
          float vol_rate_mm3_s = (mass_rate_kg_s / 1000.0f) * 1e9f; // /water density, m^3 -> mm^3

          id(evaporated_total_mm3) += vol_rate_mm3_s * elapsed_s;

          const float TANK_VOLUME_MM3 = 47160.79f; // 4.716E+04 mm^3 max tank volume
          id(evaporation_rate).publish_state((vol_rate_mm3_s * 86400.0f / TANK_VOLUME_MM3) * 100.0f); // %/day

  - id: sht40_heater_pulse
    mode: single
    then:
      - lambda: |-
          auto power = id(sht40_heater_power).current_option();
          bool is_short = id(sht40_heater_time).current_option() == "Short";
          uint16_t time_ms = is_short ? 110 : 1100;
          uint8_t command;
          if (power == "High") {
            command = is_short ? 0x32 : 0x39;
          } else if (power == "Med") {
            command = is_short ? 0x24 : 0x2F;
          } else {
            command = is_short ? 0x15 : 0x1E;
          }
          // Lock lasts until the end of the 10% duty cooldown window.
          id(sht40_heater_lock_ms) = time_ms * 10;
          id(sht40_heater_cooldown_until) = millis() + id(sht40_heater_lock_ms);
          id(sht40).stop_poller();
          id(sht40).write_command(command);
      - delay: !lambda 'return id(sht40_heater_lock_ms);'
      - lambda: 'id(sht40).start_poller();'

i2c:
  sda: GPIO0
  scl: GPIO1
  scan: false

sensor:
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"

  - platform: sht4x
    id: sht40
    address: 0x45
    heater_max_duty: 0.0
    temperature:
      name: "Raw Temperature"
      id: raw_temperature
      entity_category: diagnostic
    humidity:
      name: "Raw Humidity"
      id: raw_humidity
      entity_category: diagnostic
      on_value:
        - lambda: |-
            // The sensor runs warmer than the room (board self-heating). Its absolute vapor
            // pressure is correct, so recompute RH at the corrected air temperature.
            float t_raw = id(raw_temperature).state;
            if (isnan(t_raw) || isnan(x)) return;
            float t_air = t_raw - id(temperature_offset).state;
            auto p_sat = [](float t) { return 611.2f * expf((17.62f * t) / (243.12f + t)); };
            float rh = x * p_sat(t_raw) / p_sat(t_air);
            if (rh > 100.0f) rh = 100.0f;
            id(current_temperature).publish_state(t_air);
            id(current_humidity).publish_state(rh);
        - script.execute: humidity_check
        - script.execute: evaporation_update
    update_interval: 60s

  - platform: template
    name: "Temperature"
    id: current_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Humidity"
    id: current_humidity
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "Water Level Estimate"
    id: water_level_estimate
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:cup-water"
    update_interval: 30s
    lambda: |-
      // Mass flow 1.58333333e-5 kg/s @ 110.1 kHz / water density 1000 kg/m^3
      // -> volumetric flow 15.8333333 mm^3/s while the atomizer is on.
      const float FLOW_RATE_MM3_PER_S = 15.8333333f;
      const float TANK_VOLUME_MM3 = 47160.79f; // 4.716E+04 mm^3 max tank volume
      float atomized_mm3 = (id(atomizer_total_on_ms) / 1000.0f) * FLOW_RATE_MM3_PER_S;
      float consumed_mm3 = atomized_mm3 + id(evaporated_total_mm3);
      float level_pct = 100.0f * (1.0f - consumed_mm3 / TANK_VOLUME_MM3);
      if (level_pct < 0.0f) level_pct = 0.0f;
      if (level_pct > 100.0f) level_pct = 100.0f;
      return level_pct;

  - platform: template
    name: "Evaporation Rate"
    id: evaporation_rate
    unit_of_measurement: "%/d"
    accuracy_decimals: 2
    icon: "mdi:weather-fog"

  # Humidity readings not disturbed by a preceding atomizer pulse; this is what the controller regulates.
  - platform: template
    name: "Humidity Settled"
    id: humidity_settled
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 2

  - platform: template
    name: "Atomizer Demand"
    id: atomizer_demand
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:gauge"

output:
  - platform: ledc
    pin: GPIO5
    id: atomizer_output
    frequency: 108000Hz

number:
  # Sensor self-heating: raw SHT40 temperature minus room temperature.
  - platform: template
    name: "Temperature Offset"
    id: temperature_offset
    min_value: -5
    max_value: 10
    step: 0.1
    initial_value: 2.5
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Humidity Setpoint"
    id: humidity_setpoint
    min_value: 40
    max_value: 90
    step: 1
    initial_value: 69
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    entity_category: config

  # PI gains: controller output is average atomizer on-time in s/min.
  - platform: template
    name: "Humidity Kp"
    id: humidity_kp
    min_value: 0
    max_value: 2
    step: 0.05
    initial_value: 0.3
    unit_of_measurement: "s/(%·min)"
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "Humidity Ki"
    id: humidity_ki
    min_value: 0
    max_value: 0.2
    step: 0.005
    initial_value: 0.02
    unit_of_measurement: "s/(%·min²)"
    optimistic: true
    restore_value: true
    entity_category: config

  # Shortest pulse that reliably produces mist.
  - platform: template
    name: "Atomizer Min Pulse"
    id: atomizer_min_pulse
    min_value: 0.5
    max_value: 4.5
    step: 0.1
    initial_value: 0.5
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true
    entity_category: config

  # Maximum pulse length; must stay below 5 s for the 60 s thermal rest to be sufficient.
  - platform: template
    name: "Atomizer On Time"
    id: atomizer_on_time
    min_value: 0.5
    max_value: 4.5
    step: 0.5
    initial_value: 4.5
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true
    entity_category: config

  # Thermal rest of the transducer after every pulse.
  - platform: template
    name: "Atomizer Delay Time"
    id: atomizer_delay_time
    min_value: 60
    max_value: 600
    step: 5
    initial_value: 60
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true
    entity_category: config

# Massenstrom 1.58333333 × 10-5 kg / s @ 110.1 kHz
  - platform: template
    name: "Atomizer Frequency"
    id: atomizer_frequency
    min_value: 100000
    max_value: 120000
    step: 100
    initial_value: 110100
    unit_of_measurement: "Hz"
    optimistic: true
    restore_value: true
    entity_category: config
    set_action:
      - lambda: 'id(atomizer_output).set_frequency(x);'

select:
  - platform: template
    name: "SHT40 Heater Power"
    id: sht40_heater_power
    options:
      - "High"
      - "Med"
      - "Low"
    initial_option: "High"
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    name: "SHT40 Heater Time"
    id: sht40_heater_time
    options:
      - "Long"
      - "Short"
    initial_option: "Long"
    optimistic: true
    restore_value: true
    entity_category: config

button:
  - platform: template
    name: "Reset Water Level Estimate"
    id: water_level_reset
    entity_category: config
    on_press:
      - lambda: |-
          id(atomizer_total_on_ms) = 0;
          id(evaporated_total_mm3) = 0;
          id(last_evap_calc_ms) = millis();

  - platform: template
    name: "Activate Atomizer"
    id: atomizer_activate
    on_press:
      - if:
          condition:
            lambda: 'return millis() < id(atomizer_cooldown_until);'
          then:
            - lambda: 'ESP_LOGW("atomizer", "Atomizer locked until cooldown ends, ignoring activation");'
          else:
            - lambda: 'id(atomizer_pulse_ms) = (uint32_t)(id(atomizer_on_time).state * 1000);'
            - script.execute: atomizer_pulse

  - platform: template
    name: "Activate SHT40 Heater"
    id: sht40_heater_activate
    on_press:
      - if:
          condition:
            lambda: 'return millis() < id(sht40_heater_cooldown_until);'
          then:
            - lambda: 'ESP_LOGW("sht40_heater", "Heater locked until cooldown ends, ignoring activation");'
          else:
            - script.execute: sht40_heater_pulse
